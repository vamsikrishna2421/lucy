workflows:
  ios-testflight:
    name: LUCY — iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.anonymous.lucy
        XCODE_SCHEME: lucy
        # Add these 3 as Secure environment variables in Codemagic app settings:
        # APP_STORE_CONNECT_KEY_IDENTIFIER   (your Key ID)
        # APP_STORE_CONNECT_ISSUER_ID        (Issuer ID from App Store Connect)
        # APP_STORE_CONNECT_PRIVATE_KEY      (full contents of .p8 file)

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Apply patches
        script: npx patch-package

      - name: Expo prebuild (generate native iOS project)
        script: npx expo prebuild --platform ios --non-interactive

      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/lucy.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - vamsy.24@gmail.com
        notify:
          success: true
          failure: true
